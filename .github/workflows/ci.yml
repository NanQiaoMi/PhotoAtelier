name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: macOS Build & Test
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure Rosetta is available
        run: |
          if ! arch -x86_64 /usr/bin/true 2>/dev/null; then
            sudo softwareupdate --install-rosetta --agree-to-license
          fi

      - name: Print runner environment
        run: |
          arch -x86_64 uname -m
          sw_vers
          swift --version

      - name: Cache Lensfun dependency
        uses: actions/cache@v4
        with:
          path: .dependencies/lensfun
          key: lensfun-${{ runner.os }}-x86_64-${{ hashFiles('Scripts/prepare_lensfun.py') }}

      - name: Prepare and verify Lensfun dependency
        run: arch -x86_64 python3 Scripts/prepare_lensfun.py

      - name: Build project
        run: arch -x86_64 swift build -j 2

      - name: Run full test suite
        run: arch -x86_64 swift test -j 2
