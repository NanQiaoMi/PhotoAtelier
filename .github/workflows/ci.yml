name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: macOS Build & Test
    runs-on: macos-15-intel
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Print runner environment
        run: |
          uname -m
          sw_vers
          swift --version

      - name: Cache Lensfun dependency
        uses: actions/cache@v4
        with:
          path: .dependencies/lensfun
          key: lensfun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Scripts/prepare_lensfun.py') }}

      - name: Prepare and verify Lensfun dependency
        run: python3 Scripts/prepare_lensfun.py

      - name: Build project
        run: swift build -j 2

      - name: Run full test suite
        run: swift test -j 2
